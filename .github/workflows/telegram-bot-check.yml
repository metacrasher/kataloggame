name: Telegram bot check

on:
  push:
    paths:
      - "telegram-bot/**"
      - ".github/workflows/telegram-bot-check.yml"
  pull_request:
    paths:
      - "telegram-bot/**"
      - ".github/workflows/telegram-bot-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m py_compile telegram-bot/main.py
      - name: Install dependencies
        run: pip install -r telegram-bot/requirements.txt
